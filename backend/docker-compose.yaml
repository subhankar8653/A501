# FREE setup (no domain needed): backend on port 80, reached ONLY through your
# Cloudflare Worker (deploy/cloudflare-worker.js). Set ORIGIN_KEY in config.env —
# requests without the Worker's secret header get a bare 404.
# (If you own a domain, use docker-compose.tunnel.yaml instead.)
services:
  app:
    build: .
    container_name: tg_stremio
    restart: unless-stopped
    ports:
      - "80:8000"
    volumes:
      - ./config.env:/app/config.env:ro
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
