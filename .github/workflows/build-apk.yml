name: Build APK

# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   BACKEND_URL          your API domain, e.g. https://api.yourdomain.com   (NOT an IP / railway / vps hostname)
#   BACKEND_FALLBACKS    optional, comma separated extra domains
#   KEYSTORE_B64         your release keystore, base64 encoded   (see DEPLOY guide: keytool + base64 -w0)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Keep the repo PRIVATE.

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

env:
  # Strictly increasing -> becomes Android versionCode AND the OTA bundle version.
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          [ -n "$BACKEND_URL" ] || { echo "::error::Secret BACKEND_URL is missing"; exit 1; }
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret KEYSTORE_B64 is missing (APK updates need a fixed signing key)"; exit 1; }

      # The UI is bundled inside the APK (MainActivity -> loadDataWithBaseURL),
      # so the frontend is built here and copied into the Android assets.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          VITE_BACKEND_FALLBACKS: ${{ secrets.BACKEND_FALLBACKS }}
        run: |
          npm install
          npm run build

      - name: Copy frontend build into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r frontend/dist/. android/app/src/main/assets/
          # Version of the UI that ships inside this APK (OTA only replaces it with a NEWER one).
          echo -n "$VERSION_CODE" > android/app/src/main/assets/bundle_version.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already has the Android SDK; just accept licenses.
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      # Gradle is fetched with curl + many retries (the setup-gradle action gives up
      # after 3 tries when services.gradle.org answers 504). Falls back to a second mirror.
      - name: Set up Gradle (with retries)
        run: |
          V=8.11.1
          mkdir -p "$RUNNER_TEMP/gr" && cd "$RUNNER_TEMP/gr"
          ok=0
          for url in "https://services.gradle.org/distributions/gradle-$V-bin.zip" \
                     "https://downloads.gradle.org/distributions/gradle-$V-bin.zip" \
                     "https://github.com/gradle/gradle-distributions/releases/download/v$V/gradle-$V-bin.zip"; do
            for i in 1 2 3 4 5 6; do
              if curl -fL --connect-timeout 20 --max-time 300 -o gradle.zip "$url" && unzip -tq gradle.zip >/dev/null 2>&1; then ok=1; break 2; fi
              echo "download failed ($url, try $i), waiting..."; sleep $((i * 15))
            done
          done
          [ "$ok" = 1 ] || { echo "::error::Could not download Gradle $V"; exit 1; }
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gr/gradle-$V/bin" >> "$GITHUB_PATH"

      # libtdjson.so (TDLib, 25MB+) lives in the GitHub Release "tdlib-libs".
      # `gh` authenticates, so this also works when the repo is private.
      - name: Download TDLib native libs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "android/app/src/main/jniLibs/$abi"
            gh release download tdlib-libs --repo "$GITHUB_REPOSITORY" \
              --pattern "libtdjson-$abi.so" --output "android/app/src/main/jniLibs/$abi/libtdjson.so" --clobber
          done

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Retries with growing waits: Maven Central / Gradle plugin portal sometimes
      # answer 429 or drop TLS on shared runners (not a project bug).
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          delays=(30 60 120 240)
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt of 5..."
            if gradle assembleRelease --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              wait_s="${delays[$((attempt - 1))]}"
              echo "Build failed, retrying in ${wait_s}s..."
              sleep "$wait_s"
            fi
          done
          echo "All attempts failed."
          exit 1

      - name: Name the files for the Telegram bot
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HukaTube_${VERSION_NAME}_${VERSION_CODE}.apk"
          cp frontend/dist/index.html out/index.html
          {
            echo "### Build ${VERSION_CODE} ready"
            echo
            echo "Send the artifact files to your bot, then reply to them with:"
            echo
            echo '```'
            echo "/setapk code=${VERSION_CODE} name=${VERSION_NAME}"
            echo "What's new..."
            echo
            echo "/setbundle version=${VERSION_CODE}"
            echo "What's new..."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huka-apk
          path: out/HukaTube_*.apk

      - name: Upload OTA UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: huka-ui-bundle
          path: out/index.html
