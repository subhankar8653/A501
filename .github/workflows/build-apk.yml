name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # App-shell (HTML/JS/CSS) ab APK ke andar bundled assets se serve hota
      # hai (MainActivity.kt -> WebViewAssetLoader), koi live URL fetch nahi —
      # isliye har APK build se pehle frontend ko yahin build karke Android
      # assets folder mein copy karna zaroori hai.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend build into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r frontend/dist/. android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      # libtdjson.so files (TDLib) 25MB+ ke hai isliye repo mein commit nahi
      # kiye — inhe ek GitHub Release ke assets ke roop mein rakha hai, aur
      # har build se pehle yahan download karke jniLibs mein daal rahe hain.
      # Naya .so upload karna ho to bas Release "tdlib-libs" ke assets update
      # kar do, ye step khud-ba-khud latest file utha lega.
      - name: Download TDLib native libs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          curl -L -o android/app/src/main/jniLibs/arm64-v8a/libtdjson.so \
            https://github.com/${{ github.repository }}/releases/download/tdlib-libs/libtdjson-arm64-v8a.so
          curl -L -o android/app/src/main/jniLibs/armeabi-v7a/libtdjson.so \
            https://github.com/${{ github.repository }}/releases/download/tdlib-libs/libtdjson-armeabi-v7a.so

      - name: Build debug APK
        working-directory: android
        # dl.google.com se kabhi-kabhi TLS handshake fail ho jata hai (GitHub
        # Actions runner ka transient network issue, project code ka fault
        # nahi) — isliye retry karte hain.
        # BUG FIX (build failure: "Received status code 429 from server: Too
        # Many Requests" from repo.maven.apache.org / plugins.gradle.org):
        # yeh Maven Central/Gradle Plugin Portal ka apna transient rate-limit
        # hai, humara code/config ka fault nahi. Pehle sirf 3 attempts, har
        # ek ke beech 15s ka fixed wait — lekin har attempt khud hi 2-3
        # minute leta hai (poori dependency resolution phir se), aur agar
        # rate-limit abhi bhi active hai to 15s ka gap kaafi nahi hota, agla
        # attempt turant phir 429 khaata hai (yehi is build mein hua — teeno
        # attempts fail). Ab attempts badha kar 5 kar diye hain aur beech ka
        # wait badhta hua (30s, 60s, 120s, 240s) rakha hai, taaki rate-limit
        # window ko genuinely thandा hone ka waqt mile. gradle.properties
        # mein Gradle ke apne internal resource-retry/backoff bhi badhaye
        # gaye hain (dekho uska comment) — taaki ek hi attempt ke andar bhi
        # yeh khud recover kar sake, poora build restart kiye bina.
        run: |
          delays=(30 60 120 240)
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt of 5..."
            if gradle assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              wait_s="${delays[$((attempt - 1))]}"
              echo "Build failed, retrying in ${wait_s}s..."
              sleep "$wait_s"
            fi
          done
          echo "All attempts failed."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suhani-screen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

