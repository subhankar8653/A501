name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # App-shell (HTML/JS/CSS) ab APK ke andar bundled assets se serve hota
      # hai (MainActivity.kt -> WebViewAssetLoader), koi live URL fetch nahi —
      # isliye har APK build se pehle frontend ko yahin build karke Android
      # assets folder mein copy karna zaroori hai.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend build into Android assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r frontend/dist/. android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suhani-screen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

