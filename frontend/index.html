    <!-- BUG FIX (offline black-screen): Google Fonts yahan pehle ek external
         (fonts.googleapis.com) <link> se load hoti thi. Yeh koi bhi bundler
         inline nahi kar sakta (cross-origin), isliye offline pe yeh hamesha
         fail hoti — aur Android WebView APK build mein ab poori index.html
         hi Kotlin se ek single self-contained string ke roop mein liya jaata
         hai (dekho vite.config.js + MainActivity.kt), isliye is fail hoti
         request ko waise hi rehne dena risky tha. Ab display/body font
         seedha tailwind.config.js ke fallback stack (serif / sans-serif) par
         chalte hain — koi network dependency nahi, offline 100% reliable. -->
