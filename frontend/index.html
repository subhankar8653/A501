    <!-- BUG FIX (offline black-screen): Google Fonts yahan pehle ek external
         (fonts.googleapis.com) <link> se load hoti thi. Yeh koi bhi bundler
         inline nahi kar sakta (cross-origin), isliye offline pe yeh hamesha
         fail hoti — aur Android WebView APK build mein ab poori index.html
         hi Kotlin se ek single self-contained string ke roop mein liya jaata
         hai (dekho vite.config.js + MainActivity.kt), isliye is fail hoti
         request ko waise hi rehne dena risky tha. Ab display/body font
         seedha tailwind.config.js ke fallback stack (serif / sans-serif) par

    <style id="huka-boot-css">
      #hb{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#2b2723 0%,#15130f 55%,#0a0908 100%);
        transition:opacity .6s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
      #hb.out{opacity:0;pointer-events:none}
      #hb *{box-sizing:border-box;margin:0;padding:0}
      /* everything below animates ONLY transform/opacity => runs on the GPU
         compositor and stays smooth even while the app is booting behind it */
      #hb .glow{position:absolute;left:50%;top:44%;width:130vmin;height:130vmin;margin:-65vmin 0 0 -65vmin;border-radius:50%;
        background:radial-gradient(circle,rgba(255,186,80,.30) 0%,rgba(255,140,30,.10) 34%,transparent 64%);
        opacity:0;will-change:transform,opacity;animation:hb-glow 1.1s ease-out .1s both,hb-breathe 3.4s ease-in-out 1.3s infinite}
      @keyframes hb-glow{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
      @keyframes hb-breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.07)}}
      #hb .beam{position:absolute;left:50%;top:38%;width:150vmax;height:2px;margin-left:-75vmax;opacity:0;will-change:transform,opacity;
        background:linear-gradient(90deg,transparent,rgba(255,200,120,.55) 30%,#fff 50%,rgba(255,200,120,.55) 70%,transparent);
        box-shadow:0 0 22px 4px rgba(255,180,80,.45);transform:scaleX(0);animation:hb-beam 1s ease-out .95s both}
      @keyframes hb-beam{0%{opacity:1;transform:scaleX(0)}30%{opacity:1;transform:scaleX(.55)}100%{opacity:0;transform:scaleX(1)}}
      #hb .ember{position:absolute;inset:0;pointer-events:none}
      #hb .ember b{position:absolute;bottom:-8px;border-radius:50%;background:#ffcf80;opacity:0;will-change:transform,opacity;
        animation:hb-rise linear infinite}
      @keyframes hb-rise{0%{transform:translateY(0);opacity:0}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-105vh);opacity:0}}

      #hb .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:3vh}
      #hb .mark{position:relative;width:min(24vw,96px);height:min(24vw,96px);margin-bottom:min(5vw,22px)}
      #hb .emb{position:absolute;inset:0;will-change:transform,opacity;opacity:0;animation:hb-emb 1s cubic-bezier(.2,.9,.25,1.15) .15s both}
      @keyframes hb-emb{0%{opacity:0;transform:perspective(500px) rotateY(-110deg) scale(.35)}60%{opacity:1}100%{opacity:1;transform:perspective(500px) rotateY(0) scale(1)}}
      #hb .emb-in{position:absolute;inset:0;will-change:transform;animation:hb-pulse .55s ease-out .98s both}
      @keyframes hb-pulse{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
      #hb .emb svg{width:100%;height:100%;display:block;overflow:visible}
      #hb .sparks i{position:absolute;left:50%;top:50%;border-radius:50%;margin:-2px 0 0 -2px;opacity:0;will-change:transform,opacity;
        animation:hb-spark .9s cubic-bezier(.1,.7,.3,1) .98s both}
      @keyframes hb-spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
      #hb .ring{position:absolute;left:50%;top:50%;width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;opacity:0;will-change:transform,opacity;
        border:2px solid rgba(255,208,120,.9);animation:hb-ring 1.1s cubic-bezier(.1,.7,.2,1) .98s both}
      #hb .ring.r2{animation-delay:1.12s;border-color:rgba(255,255,255,.7)}
      @keyframes hb-ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(7)}}
      #hb .flash{position:absolute;left:50%;top:50%;width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;opacity:0;will-change:transform,opacity;
        background:radial-gradient(circle,#fff 0%,rgba(255,210,130,.6) 38%,transparent 70%);animation:hb-flash .7s ease-out .98s both}
      @keyframes hb-flash{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(5)}}

      #hb .logoWrap{position:relative;overflow:hidden;padding:0 .35em}
      #hb .logo{display:flex;justify-content:center;font-family:'Roboto','Segoe UI',system-ui,sans-serif;font-weight:900;font-style:normal;
        font-size:min(15.5vw,84px);line-height:1.18;letter-spacing:-.02em;transform:skewX(-8deg)}
      #hb .lc{display:block;overflow:hidden;padding:0 .01em}
      #hb .l{display:block;transform:translateY(118%);opacity:0;will-change:transform,opacity;
        background-image:linear-gradient(180deg,#ffffff 0%,#dcdce6 45%,#9d9dab 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
        animation:hb-let .8s cubic-bezier(.16,.9,.25,1.08) var(--d) both}
      #hb .l.g{background-image:linear-gradient(180deg,#fff3c4 0%,#f7bd45 48%,#c97d08 100%)}
      @keyframes hb-let{0%{opacity:0;transform:translateY(118%)}25%{opacity:1}100%{opacity:1;transform:translateY(0)}}
      #hb .sheen{position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;opacity:0;will-change:transform,opacity;
        background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.38) 50%,transparent 100%);transform:translateX(-120%) skewX(-18deg);
        animation:hb-sheen 1s ease-in-out 1.95s both}
      @keyframes hb-sheen{0%{opacity:1;transform:translateX(-120%) skewX(-18deg)}100%{opacity:1;transform:translateX(420%) skewX(-18deg)}}

      #hb .rule{height:2px;width:min(56vw,270px);margin-top:min(3.4vw,14px);border-radius:2px;opacity:0;transform:scaleX(0);will-change:transform,opacity;
        background:linear-gradient(90deg,transparent,#f5b63a 30%,#fff3c4 50%,#f5b63a 70%,transparent);box-shadow:0 0 12px rgba(245,182,58,.55);
        animation:hb-rule .8s cubic-bezier(.2,.8,.2,1) 1.95s both}
      @keyframes hb-rule{to{opacity:1;transform:scaleX(1)}}

      #hb .tg{margin-top:min(5vw,22px);display:flex;flex-direction:column;align-items:center;gap:10px;
        font:600 13px/1 'Roboto',system-ui,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#d8d8e0}
      #hb .tg .row{display:flex;gap:.9em;align-items:center;justify-content:center;white-space:nowrap}
      #hb .tg span{opacity:0;transform:translateY(8px);will-change:transform,opacity;animation:hb-tg .6s ease-out var(--d) both}
      #hb .tg .dot{color:#f5b63a;letter-spacing:0}
      #hb .tg .gold{color:#f7c14f}
      @keyframes hb-tg{to{opacity:1;transform:none}}
      #hb .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%)}
    </style>

    <script>
    (function () {
      var el = document.getElementById('hb');
      if (!el) return;
      try {
        // once per app session: reloads / pull-to-refresh must not replay it
        if (sessionStorage.getItem('huka-intro-done') === '1') { el.parentNode.removeChild(el); return; }
        sessionStorage.setItem('huka-intro-done', '1');
      } catch (e) {}
      var MIN = 5000, MAX = 8200, t0 = Date.now(), done = false, stopSnd = function () {};
      function leave() {
        if (done) return; done = true;
        el.classList.add('out');
        try { stopSnd(); } catch (e) {}
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
      }
      el.addEventListener('click', leave);
      var iv = setInterval(function () {
        var age = Date.now() - t0;
        if (age >= MAX || (age >= MIN && window.__hukaReady)) { clearInterval(iv); leave(); }
      }, 200);

      // ---- sound (Web Audio, synthesized; silent if unavailable) ----
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        if (ctx.state === 'suspended') ctx.resume();
        var T = ctx.currentTime + 0.08;
        var master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
        // light reverb tail (short mono IR, cheap to build)
        var irLen = Math.floor(ctx.sampleRate * 1.1), ir = ctx.createBuffer(1, irLen, ctx.sampleRate), d = ir.getChannelData(0), amp = 1, k = Math.pow(0.0005, 1 / irLen);
        for (var i = 0; i < irLen; i++) { d[i] = (Math.random() * 2 - 1) * amp; amp *= k; }
        var cv = ctx.createConvolver(); cv.buffer = ir; var wet = ctx.createGain(); wet.gain.value = 0.28;
        master.connect(cv); cv.connect(wet); wet.connect(ctx.destination);
        var nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.2), ctx.sampleRate), nd = nb.getChannelData(0);
        for (var j = 0; j < nd.length; j++) nd[j] = Math.random() * 2 - 1;
        function noise(at, dur, f0, f1, vol, type, q) {
          var s = ctx.createBufferSource(); s.buffer = nb;
          var f = ctx.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q || 1;
          f.frequency.setValueAtTime(f0, T + at); f.frequency.exponentialRampToValueAtTime(f1, T + at + dur);
          var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, T + at);
          g.gain.exponentialRampToValueAtTime(vol, T + at + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, T + at + dur);
          s.connect(f); f.connect(g); g.connect(master); s.start(T + at); s.stop(T + at + dur + 0.05);
        }
        function tone(at, dur, f0, f1, vol, type, atk) {
          var o = ctx.createOscillator(); o.type = type || 'sine';
          o.frequency.setValueAtTime(f0, T + at); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), T + at + dur);
          var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, T + at);
          g.gain.exponentialRampToValueAtTime(vol, T + at + (atk || 0.012)); g.gain.exponentialRampToValueAtTime(0.0001, T + at + dur);
          o.connect(g); g.connect(master); o.start(T + at); o.stop(T + at + dur + 0.05);
        }
        noise(0.12, 0.85, 220, 4200, 0.34, 'bandpass', 0.8);     // rising riser
        tone(0.12, 0.85, 80, 560, 0.15, 'sine', 0.3);
        tone(0.98, 0.95, 130, 32, 0.95, 'sine', 0.008);           // boom
        tone(0.98, 0.25, 520, 90, 0.35, 'triangle', 0.005);
        noise(0.98, 0.6, 5200, 260, 0.7, 'bandpass', 0.5);        // crack
        for (var a = 0; a < 8; a++) tone(1.02 + a * 0.05, 0.22, 2400 + a * 260, 3400 + a * 300, 0.05, 'sine');
        var sc = [392, 440, 523, 587, 659, 784, 880, 1047];       // one ping per letter
        for (var b = 0; b < 8; b++) tone(1.14 + b * 0.075, 0.5, sc[b], sc[b], 0.12, 'sine', 0.01);
        [2.4, 2.75, 3.1, 3.5, 3.85].forEach(function (x) { tone(x, 0.08, 1500, 1500, 0.05, 'triangle'); });
        [262, 392, 523, 659, 784].forEach(function (f, n) { tone(3.85 + n * 0.03, 1.6, f, f, 0.12, 'sine', 0.05); });
        stopSnd = function () {
          master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0, ctx.currentTime, 0.1);
          setTimeout(function () { try { ctx.close(); } catch (e) {} }, 800);
        };
      } catch (e) {}
    })();
    </script>
