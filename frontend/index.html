    <!-- BUG FIX (offline black-screen): Google Fonts yahan pehle ek external
         (fonts.googleapis.com) <link> se load hoti thi. Yeh koi bhi bundler
         inline nahi kar sakta (cross-origin), isliye offline pe yeh hamesha
         fail hoti — aur Android WebView APK build mein ab poori index.html
         hi Kotlin se ek single self-contained string ke roop mein liya jaata
         hai (dekho vite.config.js + MainActivity.kt), isliye is fail hoti
         request ko waise hi rehne dena risky tha. Ab display/body font

    <style id="huka-boot-css">
      html,body{-webkit-touch-callout:none}
      body{-webkit-user-select:none;user-select:none}
      input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
      #hb{position:fixed;inset:0;z-index:2147483000;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
        background:radial-gradient(ellipse at 50% 50%,#2b2723 0%,#15130f 55%,#0a0908 100%)}
      #hb,#hb *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
      #hb *{box-sizing:border-box}
      #hb{--s:min(26vw,112px)}
      /* Only transform/opacity are animated => GPU-composited, stays smooth even
         while the app boots behind. Animations start only after .go (set once
         the app has mounted) so a busy main thread can never skip frames. */
      #hb .cw{position:absolute;inset:0}
      /* EXIT: logo + effects fade out over the (still opaque) dark backdrop first, THEN the
         backdrop itself fades away into the app. Nothing slides, no ghost of the intro. */
      #hb .cover{position:absolute;inset:0;opacity:0;pointer-events:none}
      #hb.out .cover{animation:hb-cov .34s ease-in-out forwards}
      @keyframes hb-cov{to{opacity:1}}
      #hb.out .cw{animation:hb-cx .32s ease-in forwards}
      @keyframes hb-cx{to{opacity:0;transform:scale(1.05)}}
      #hb.out{animation:hb-fade .5s ease-in-out .42s forwards;pointer-events:none}
      @keyframes hb-fade{to{opacity:0}}

      #hb .glow{position:absolute;left:50%;top:44%;width:130vmin;height:130vmin;margin:-65vmin 0 0 -65vmin;border-radius:50%;opacity:0;will-change:transform,opacity;
        background:radial-gradient(circle,rgba(253,208,8,.22) 0%,rgba(255,150,30,.08) 36%,transparent 64%)}
      #hb.go .glow{animation:hb-glow 1.2s ease-out .05s both}
      @keyframes hb-glow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @keyframes hb-breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.68;transform:scale(1.07)}}
      #hb .beam{position:absolute;left:50%;top:38%;width:150vmax;height:2px;margin-left:-75vmax;opacity:0;transform:scaleX(0);will-change:transform,opacity;
        background:linear-gradient(90deg,transparent,rgba(255,220,100,.6) 30%,#fff 50%,rgba(255,220,100,.6) 70%,transparent);box-shadow:0 0 22px 4px rgba(253,208,8,.45)}
      #hb.go .beam{animation:hb-beam 1s ease-out 1.3s forwards}
      @keyframes hb-beam{0%{opacity:1;transform:scaleX(0)}30%{opacity:1;transform:scaleX(.55)}100%{opacity:0;transform:scaleX(1)}}
      #hb .ember{position:absolute;inset:0;pointer-events:none}
      #hb .ember b{position:absolute;bottom:-8px;border-radius:50%;background:#ffd95a;opacity:0;will-change:transform,opacity}
      #hb.go .ember b{animation:hb-rise linear infinite}
      @keyframes hb-rise{0%{transform:translateY(0);opacity:0}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-105vh);opacity:0}}

      #hb .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:3vh}
      #hb .mark{position:relative;width:var(--s);height:var(--s);margin-bottom:min(5.5vw,24px)}
      /* .mv: lifts the tile from screen-centre (where the native splash shows it) to its final place */
      #hb .mv{position:absolute;inset:0;transform:translateY(var(--dy,0px));will-change:transform}
      #hb.go .mv{animation:hb-move .8s cubic-bezier(.65,0,.2,1) .6s both}
      @keyframes hb-move{from{transform:translateY(var(--dy,0px))}to{transform:translateY(0)}}
      #hb .tp{position:absolute;inset:0;border-radius:22.5%;will-change:transform;
        box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 64px rgba(253,208,8,.26)}
      #hb.go .tp{animation:hb-pulse .55s ease-out .2s both,hb-pulse .55s ease-out 4.26s both}
      @keyframes hb-pulse{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
      #hb .tile{position:absolute;inset:0;border-radius:22.5%;overflow:hidden}
      #hb .tile svg{width:100%;height:100%;display:block}
      #hb .tsheen{position:absolute;top:-10%;bottom:-10%;left:0;width:45%;opacity:0;will-change:transform,opacity;
        background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-140%) skewX(-18deg)}
      #hb.go .tsheen{animation:hb-tsheen .7s ease-in-out .3s forwards,hb-tsheen .8s ease-in-out 4.2s forwards}
      @keyframes hb-tsheen{0%{opacity:1;transform:translateX(-140%) skewX(-18deg)}100%{opacity:1;transform:translateX(330%) skewX(-18deg)}}
      #hb .ring{position:absolute;left:50%;top:50%;width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;opacity:0;will-change:transform,opacity;
        border:2px solid rgba(253,208,8,.9)}
      #hb.go .ring{animation:hb-ring 1.1s cubic-bezier(.1,.7,.2,1) 1.34s forwards}
      #hb .ring.r2{border-color:rgba(255,255,255,.7)}
      #hb.go .ring.r2{animation-delay:1.48s}
      #hb .ring.r3{border-color:rgba(255,240,170,.8)}
      #hb.go .ring.r3{animation:hb-ring 1.1s cubic-bezier(.1,.7,.2,1) 4.26s forwards}
      @keyframes hb-ring{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(7)}}
      #hb .flash{position:absolute;left:50%;top:50%;width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;opacity:0;will-change:transform,opacity;
        background:radial-gradient(circle,#fff 0%,rgba(255,225,120,.6) 38%,transparent 70%)}
      #hb.go .flash{animation:hb-flash .7s ease-out 1.34s forwards}
      @keyframes hb-flash{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(5)}}
      #hb .sparks i{position:absolute;left:50%;top:50%;border-radius:50%;margin:-2px 0 0 -2px;opacity:0;will-change:transform,opacity}
      #hb.go .sparks i{animation:hb-spark .95s cubic-bezier(.1,.7,.3,1) 1.34s forwards}
      @keyframes hb-spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}

      #hb .logoWrap{position:relative;padding:0 .35em}
      #hb .logo{display:flex;justify-content:center;font-family:'Roboto','Segoe UI',system-ui,sans-serif;font-weight:900;
        font-size:min(15.5vw,84px);line-height:1.22;letter-spacing:-.01em;font-style:italic;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
      #hb .lc{display:block;overflow:hidden;padding:0 .16em;margin:0 -.16em}
      #hb .l{display:block;padding:0 .16em;margin:0 -.16em;transform:translateY(118%);opacity:0;will-change:transform,opacity;
        background-image:linear-gradient(180deg,#ffffff 0%,#dcdce6 45%,#9d9dab 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
      #hb .l.g{background-image:linear-gradient(180deg,#fff6b0 0%,#fdd008 50%,#d99a00 100%)}
      #hb.go .l{animation:hb-let .8s cubic-bezier(.16,.9,.25,1.08) var(--d) both}
      @keyframes hb-let{0%{opacity:0;transform:translateY(118%)}25%{opacity:1}100%{opacity:1;transform:translateY(0)}}
      #hb .sheen{position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;opacity:0;will-change:transform,opacity;
        background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.36) 50%,transparent 100%);transform:translateX(-120%) skewX(-18deg)}
      #hb.go .sheen{animation:hb-sheen 1s ease-in-out 2.35s both}
      @keyframes hb-sheen{0%{opacity:1;transform:translateX(-120%) skewX(-18deg)}100%{opacity:1;transform:translateX(420%) skewX(-18deg)}}

      #hb .rule{height:2px;width:min(56vw,270px);margin-top:min(3.4vw,14px);border-radius:2px;opacity:0;transform:scaleX(0);will-change:transform,opacity;
        background:linear-gradient(90deg,transparent,#fdd008 30%,#fff6b0 50%,#fdd008 70%,transparent);box-shadow:0 0 12px rgba(253,208,8,.5)}
      #hb.go .rule{animation:hb-rule .8s cubic-bezier(.2,.8,.2,1) 2.2s both}
      @keyframes hb-rule{to{opacity:1;transform:scaleX(1)}}
      #hb .tg{margin-top:min(5vw,22px);display:flex;flex-direction:column;align-items:center;gap:10px;
        font:600 13px/1 'Roboto',system-ui,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#d8d8e0}
      #hb .tg .row{display:flex;gap:.9em;align-items:center;justify-content:center;white-space:nowrap}
      #hb .tg span{opacity:0;transform:translateY(8px);will-change:transform,opacity}
      #hb.go .tg span{animation:hb-tg .6s ease-out var(--d) both}
      #hb .tg .dot{color:#fdd008;letter-spacing:0}
      #hb .tg .gold{color:#fdd008}
      @keyframes hb-tg{to{opacity:1;transform:none}}
      #hb .ld{position:absolute;left:50%;top:calc(50% + var(--s) / 2 + 34px);width:min(46vw,190px);margin-left:calc(min(46vw,190px) / -2);opacity:0;
        animation:hb-ldin .5s ease .2s forwards}
      #hb .ldb{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
      #hb .ldf{position:absolute;inset:0;border-radius:4px;transform:scaleX(0);transform-origin:0 50%;overflow:hidden;will-change:transform;
        transition:transform .22s linear;background:linear-gradient(90deg,#d99a00,#fdd008 60%,#fff6b0)}
      #hb .ldsh{position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:hb-ld 1.2s ease-in-out infinite}
      #hb .ldr{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font:600 11px/1 'Roboto',system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase}
      #hb .ldt{color:#8d8a84}
      #hb .ldp{color:#fdd008;font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
      #hb.go .ld{animation:hb-ldout .35s ease forwards}
      @keyframes hb-ldin{to{opacity:1}}
      @keyframes hb-ldout{from{opacity:1}to{opacity:0;visibility:hidden}}
      @keyframes hb-ld{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      /* ---- cinematic background: bokeh + aurora + sparkles + orbit rings (transform/opacity only) ---- */
      #hb .bgblob{position:absolute;width:95vmin;height:95vmin;border-radius:50%;will-change:transform}
      #hb .b1{left:-34vmin;top:-22vmin;background:radial-gradient(circle,rgba(253,176,30,.20),transparent 66%)}
      #hb .b2{right:-38vmin;bottom:-26vmin;background:radial-gradient(circle,rgba(110,90,255,.26),transparent 66%)}
      #hb .b3{left:-30vmin;bottom:-22vmin;background:radial-gradient(circle,rgba(40,190,190,.16),transparent 66%)}
      #hb.go .b1{animation:hb-d1 13s ease-in-out infinite alternate}
      #hb.go .b2{animation:hb-d2 16s ease-in-out infinite alternate}
      #hb.go .b3{animation:hb-d1 19s ease-in-out infinite alternate-reverse}
      @keyframes hb-d1{to{transform:translate(18vmin,14vmin) scale(1.15)}}
      @keyframes hb-d2{to{transform:translate(-16vmin,-12vmin) scale(1.12)}}
      #hb .bk{position:absolute;inset:0;pointer-events:none}
      #hb .bk i{position:absolute;border-radius:50%;opacity:calc(var(--o) * .22);will-change:transform,opacity;
        background:radial-gradient(circle,rgba(var(--c),.10) 0,rgba(var(--c),.16) 58%,rgba(var(--c),.50) 64%,rgba(var(--c),0) 71%)}
      #hb.go .bk i{opacity:calc(var(--o) * .5);transition:opacity 1.5s ease;animation:hb-bk 22s ease-in-out infinite alternate}
      @keyframes hb-bk{to{transform:translate(var(--dx),var(--dy))}}
      #hb .sp{position:absolute;inset:0;pointer-events:none}
      #hb .sp s{position:absolute;opacity:0;background:linear-gradient(135deg,#fff,#ffe27a);will-change:transform,opacity;
        clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%)}
      #hb.go .sp s{animation:hb-tw 3s ease-in-out infinite}
      @keyframes hb-tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
      /* orbit rings around the tile (appear with the burst) */
      #hb .orb{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
      #hb .obw{position:absolute;opacity:0;--d:calc(var(--s) * var(--k));width:var(--d);height:var(--d);left:calc(var(--d) / -2);top:calc(var(--d) / -2);will-change:transform,opacity}
      #hb.go .obw{animation:hb-ob 1.3s cubic-bezier(.2,.9,.25,1.08) 1.4s both}
      @keyframes hb-ob{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
      #hb .ob{position:absolute;inset:0;border-radius:50%;transform:perspective(520px) rotateX(var(--tx)) rotateY(var(--ty))}
      #hb .obs{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(253,208,8,.40);box-shadow:0 0 16px rgba(253,208,8,.16),inset 0 0 16px rgba(253,208,8,.08);
        animation:hb-spin 8s linear infinite;will-change:transform}
      #hb .obs i{position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(253,208,8,.9)}
      @keyframes hb-spin{to{transform:rotate(360deg)}}
      #hb.go .stage{animation:hb-push 8s cubic-bezier(.25,.1,.3,1) both}
      @keyframes hb-push{from{transform:scale(1)}to{transform:scale(1.055)}}
      #hb .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%)}
    </style>
  </head>

      var ctx = null, clip = null, audioDone = false, audioInit = false;
      // audio is prepared only after the app has mounted, so it never competes with the bundle boot
      function initAudio() {

      function leave() {
