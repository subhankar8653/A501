    <style id="huka-boot-css">
      #hb{position:fixed;inset:0;z-index:2147483000;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
        background:radial-gradient(ellipse at 50% 50%,#2b2723 0%,#15130f 55%,#0a0908 100%)}
      #hb *{box-sizing:border-box;margin:0;padding:0}
      #hb{--s:min(26vw,112px)}
      /* Only transform/opacity are animated => GPU-composited, stays smooth even
         while the app boots behind. Animations start only after .go (set once
         the app has mounted) so a busy main thread can never skip frames. */
      #hb .cw{position:absolute;inset:0}
      #hb.out .cw{animation:hb-cx .32s ease-in forwards}
      @keyframes hb-cx{to{opacity:0;transform:scale(1.06)}}
      #hb.out{animation:hb-curtain .6s cubic-bezier(.75,0,.2,1) .2s forwards;box-shadow:0 30px 60px rgba(0,0,0,.6)}
      @keyframes hb-curtain{to{transform:translateY(-104%)}}
      #hb.out::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#fdd008,#fff3a8,#fdd008,transparent);box-shadow:0 0 18px 3px rgba(253,208,8,.6)}

      #hb .glow{position:absolute;left:50%;top:44%;width:130vmin;height:130vmin;margin:-65vmin 0 0 -65vmin;border-radius:50%;opacity:0;will-change:transform,opacity;
        background:radial-gradient(circle,rgba(253,208,8,.22) 0%,rgba(255,150,30,.08) 36%,transparent 64%)}
      #hb.go .glow{animation:hb-glow 1.2s ease-out .05s both,hb-breathe 3.6s ease-in-out 1.3s infinite}
      @keyframes hb-glow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @keyframes hb-breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.68;transform:scale(1.07)}}
      #hb .beam{position:absolute;left:50%;top:38%;width:150vmax;height:2px;margin-left:-75vmax;opacity:0;transform:scaleX(0);will-change:transform,opacity;
        background:linear-gradient(90deg,transparent,rgba(255,220,100,.6) 30%,#fff 50%,rgba(255,220,100,.6) 70%,transparent);box-shadow:0 0 22px 4px rgba(253,208,8,.45)}
      #hb.go .beam{animation:hb-beam 1s ease-out 1.3s forwards}
      @keyframes hb-beam{0%{opacity:1;transform:scaleX(0)}30%{opacity:1;transform:scaleX(.55)}100%{opacity:0;transform:scaleX(1)}}
      #hb .ember{position:absolute;inset:0;pointer-events:none}
      #hb .ember b{position:absolute;bottom:-8px;border-radius:50%;background:#ffd95a;opacity:0;will-change:transform,opacity}
      #hb.go .ember b{animation:hb-rise linear infinite}
      @keyframes hb-rise{0%{transform:translateY(0);opacity:0}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-105vh);opacity:0}}

      #hb .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:3vh}
      #hb .mark{position:relative;width:var(--s);height:var(--s);margin-bottom:min(5.5vw,24px)}
      /* .mv: lifts the tile from screen-centre (where the native splash shows it) to its final place */
      #hb .mv{position:absolute;inset:0;transform:translateY(var(--dy,0px));will-change:transform}
      #hb.go .mv{animation:hb-move .8s cubic-bezier(.65,0,.2,1) .6s both}
      @keyframes hb-move{from{transform:translateY(var(--dy,0px))}to{transform:translateY(0)}}
      #hb .tp{position:absolute;inset:0;border-radius:22.5%;will-change:transform;
        box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 64px rgba(253,208,8,.26)}
      #hb.go .tp{animation:hb-pulse .55s ease-out .2s both}
      @keyframes hb-pulse{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
      #hb .tile{position:absolute;inset:0;border-radius:22.5%;overflow:hidden}
      #hb .tile svg{width:100%;height:100%;display:block}
      #hb .tsheen{position:absolute;top:-10%;bottom:-10%;left:0;width:45%;opacity:0;will-change:transform,opacity;
        background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-140%) skewX(-18deg)}
      #hb.go .tsheen{animation:hb-tsheen .7s ease-in-out .3s forwards}
      @keyframes hb-tsheen{0%{opacity:1;transform:translateX(-140%) skewX(-18deg)}100%{opacity:1;transform:translateX(330%) skewX(-18deg)}}
      #hb .ring{position:absolute;left:50%;top:50%;width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;opacity:0;will-change:transform,opacity;
        border:2px solid rgba(253,208,8,.9)}
      #hb.go .ring{animation:hb-ring 1.1s cubic-bezier(.1,.7,.2,1) 1.34s forwards}
      #hb .ring.r2{border-color:rgba(255,255,255,.7)}
      #hb.go .ring.r2{animation-delay:1.48s}
      @keyframes hb-ring{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(7)}}
      #hb .flash{position:absolute;left:50%;top:50%;width:100%;height:100%;margin:-50% 0 0 -50%;border-radius:50%;opacity:0;will-change:transform,opacity;
        background:radial-gradient(circle,#fff 0%,rgba(255,225,120,.6) 38%,transparent 70%)}
      #hb.go .flash{animation:hb-flash .7s ease-out 1.34s forwards}
      @keyframes hb-flash{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(5)}}
      #hb .sparks i{position:absolute;left:50%;top:50%;border-radius:50%;margin:-2px 0 0 -2px;opacity:0;will-change:transform,opacity}
      #hb.go .sparks i{animation:hb-spark .95s cubic-bezier(.1,.7,.3,1) 1.34s forwards}
      @keyframes hb-spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}

      #hb .logoWrap{position:relative;overflow:hidden;padding:0 .35em}
      #hb .logo{display:flex;justify-content:center;font-family:'Roboto','Segoe UI',system-ui,sans-serif;font-weight:900;
        font-size:min(15.5vw,84px);line-height:1.18;letter-spacing:-.02em;transform:skewX(-8deg)}
      #hb .lc{display:block;overflow:hidden}
      #hb .l{display:block;transform:translateY(118%);opacity:0;will-change:transform,opacity;
        background-image:linear-gradient(180deg,#ffffff 0%,#dcdce6 45%,#9d9dab 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
      #hb .l.g{background-image:linear-gradient(180deg,#fff6b0 0%,#fdd008 50%,#d99a00 100%)}
      #hb.go .l{animation:hb-let .8s cubic-bezier(.16,.9,.25,1.08) var(--d) both}
      @keyframes hb-let{0%{opacity:0;transform:translateY(118%)}25%{opacity:1}100%{opacity:1;transform:translateY(0)}}
      #hb .sheen{position:absolute;top:0;bottom:0;left:0;width:34%;pointer-events:none;opacity:0;will-change:transform,opacity;
        background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.36) 50%,transparent 100%);transform:translateX(-120%) skewX(-18deg)}
      #hb.go .sheen{animation:hb-sheen 1s ease-in-out 2.35s both}
      @keyframes hb-sheen{0%{opacity:1;transform:translateX(-120%) skewX(-18deg)}100%{opacity:1;transform:translateX(420%) skewX(-18deg)}}

      #hb .rule{height:2px;width:min(56vw,270px);margin-top:min(3.4vw,14px);border-radius:2px;opacity:0;transform:scaleX(0);will-change:transform,opacity;

      #hb.go .rule{animation:hb-rule .8s cubic-bezier(.2,.8,.2,1) 2.2s both}
      @keyframes hb-rule{to{opacity:1;transform:scaleX(1)}}
      #hb .tg{margin-top:min(5vw,22px);display:flex;flex-direction:column;align-items:center;gap:10px;
        font:600 13px/1 'Roboto',system-ui,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#d8d8e0}
      #hb .tg .row{display:flex;gap:.9em;align-items:center;justify-content:center;white-space:nowrap}
      #hb .tg span{opacity:0;transform:translateY(8px);will-change:transform,opacity}
      #hb.go .tg span{animation:hb-tg .6s ease-out var(--d) both}
      #hb .tg .dot{color:#fdd008;letter-spacing:0}
      #hb .tg .gold{color:#fdd008}
      @keyframes hb-tg{to{opacity:1;transform:none}}
      #hb .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%)}
    </style>

    <script>
    (function () {
      var el = document.getElementById('hb');
      if (!el) return;
      try {
        // once per app session: reloads / pull-to-refresh must not replay it
        if (sessionStorage.getItem('huka-intro-done') === '1') { el.parentNode.removeChild(el); return; }
        sessionStorage.setItem('huka-intro-done', '1');
      } catch (e) {}
      // pre-go: tile sits at the exact screen centre (same spot as the native splash logo)
      try {
        var mk = el.querySelector('.mark').getBoundingClientRect();
        var dy = window.innerHeight / 2 - (mk.top + mk.height / 2);
        el.style.setProperty('--dy', dy + 'px');
      } catch (e) {}
      var MIN = 4900, MAX = 9500, t0 = 0, done = false, started = false, stopSnd = function () {};
      function leave() {
        if (done) return; done = true;
        el.classList.add('out');
        try { stopSnd(); } catch (e) {}
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 950);
      }
      el.addEventListener('click', function () { if (started) leave(); });
      function sound() {
        try {
          var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          var ctx = new AC(); if (ctx.state === 'suspended') ctx.resume();
          var T = ctx.currentTime + 0.06;
          var master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
          var irLen = Math.floor(ctx.sampleRate * 1.1), ir = ctx.createBuffer(1, irLen, ctx.sampleRate), d = ir.getChannelData(0), amp = 1, k = Math.pow(0.0005, 1 / irLen);
          for (var i = 0; i < irLen; i++) { d[i] = (Math.random() * 2 - 1) * amp; amp *= k; }
          var cv = ctx.createConvolver(); cv.buffer = ir; var wet = ctx.createGain(); wet.gain.value = 0.28;
          master.connect(cv); cv.connect(wet); wet.connect(ctx.destination);
          var nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 1.2), ctx.sampleRate), nd = nb.getChannelData(0);
          for (var j = 0; j < nd.length; j++) nd[j] = Math.random() * 2 - 1;
          function noise(at, dur, f0, f1, vol, type, q) {
            var s = ctx.createBufferSource(); s.buffer = nb;
            var f = ctx.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q || 1;
            f.frequency.setValueAtTime(f0, T + at); f.frequency.exponentialRampToValueAtTime(f1, T + at + dur);
            var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, T + at);
            g.gain.exponentialRampToValueAtTime(vol, T + at + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, T + at + dur);
            s.connect(f); f.connect(g); g.connect(master); s.start(T + at); s.stop(T + at + dur + 0.05);
          }
          function tone(at, dur, f0, f1, vol, type, atk) {
            var o = ctx.createOscillator(); o.type = type || 'sine';
            o.frequency.setValueAtTime(f0, T + at); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), T + at + dur);
            var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, T + at);
            g.gain.exponentialRampToValueAtTime(vol, T + at + (atk || 0.012)); g.gain.exponentialRampToValueAtTime(0.0001, T + at + dur);
            o.connect(g); g.connect(master); o.start(T + at); o.stop(T + at + dur + 0.05);
          }
          [880, 1320, 1760].forEach(function (f, n) { tone(0.2 + n * 0.04, 0.6, f, f, 0.08, 'sine', 0.01); });   // tile pulse chime
          noise(0.6, 0.8, 220, 4200, 0.3, 'bandpass', 0.8); tone(0.6, 0.8, 80, 560, 0.14, 'sine', 0.3);          // lift riser
          tone(1.34, 0.95, 130, 32, 0.95, 'sine', 0.008); tone(1.34, 0.25, 520, 90, 0.35, 'triangle', 0.005);   // boom
          noise(1.34, 0.6, 5200, 260, 0.7, 'bandpass', 0.5);
          for (var a = 0; a < 8; a++) tone(1.38 + a * 0.05, 0.22, 2400 + a * 260, 3400 + a * 300, 0.05, 'sine');
          var sc = [392, 440, 523, 587, 659, 784, 880, 1047];
          for (var b = 0; b < 8; b++) tone(1.24 + b * 0.065, 0.5, sc[b], sc[b], 0.11, 'sine', 0.01);
          [2.5, 2.8, 3.1, 3.4, 3.7].forEach(function (x) { tone(x, 0.08, 1500, 1500, 0.05, 'triangle'); });
          [262, 392, 523, 659, 784].forEach(function (f, n) { tone(3.7 + n * 0.03, 1.5, f, f, 0.12, 'sine', 0.05); });
          stopSnd = function () {

      function go() {
