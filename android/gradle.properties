org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# BUG FIX (CI build failure: "Received status code 429 from server: Too Many
# Requests" from repo.maven.apache.org / plugins.gradle.org while resolving
# dependencies — dekho build-apk.yml ka "Build debug APK" step ka comment):
# Gradle apne aap bhi failed resource-downloads ko retry karta hai, lekin
# default sirf 3 retries aur sirf 500ms ka initial backoff — jab Maven
# Central/Gradle Plugin Portal genuinely rate-limit kar rahe hon (429), itna
# chhota backoff usually us rate-limit window ke andar hi khatam ho jaata
# hai, isliye retry bhi turant dobara 429 khaata hai. Yahan retries badha kar
# aur backoff kaafi lamba kar ke Gradle ko is transient rate-limit se khud
# hi (poore build ko restart kiye bina) recover karne ka behtar mauka de
# rahe hain.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=2000
